<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d4a2a"/>
      <stop offset="100%" style="stop-color:#062a18"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e5e5e5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Chip outer -->
  <circle cx="256" cy="256" r="180" fill="url(#gold)"/>
  <circle cx="256" cy="256" r="165" fill="url(#chip)"/>
  <!-- Chip edge notches -->
  <g fill="url(#gold)">
    <rect x="248" y="76" width="16" height="30" rx="4"/>
    <rect x="248" y="406" width="16" height="30" rx="4"/>
    <rect x="76" y="248" width="30" height="16" rx="4"/>
    <rect x="406" y="248" width="30" height="16" rx="4"/>
    <rect x="125" y="125" width="16" height="30" rx="4" transform="rotate(45 133 140)"/>
    <rect x="371" y="125" width="16" height="30" rx="4" transform="rotate(-45 379 140)"/>
    <rect x="125" y="357" width="16" height="30" rx="4" transform="rotate(-45 133 372)"/>
    <rect x="371" y="357" width="16" height="30" rx="4" transform="rotate(45 379 372)"/>
  </g>
  <!-- Inner ring -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <!-- Spade symbol -->
  <path d="M256 160 C256 160 190 230 190 280 C190 310 210 330 240 330 C255 330 256 320 256 320 C256 320 257 330 272 330 C302 330 322 310 322 280 C322 230 256 160 256 160 Z M246 325 L246 365 L266 365 L266 325" fill="#1a1a1a"/>
